name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pytest-mock==3.14.0 groq==0.13.0 python-dotenv==1.0.1

      - name: Run tests
        env:
          GROQ_API_KEY: "dummy-key-for-ci"
        run: python -m pytest tests/ -v